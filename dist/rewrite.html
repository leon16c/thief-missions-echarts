<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thief Guild FM Visualization</title>
</head>
<body>
    <div id="viz-root"></div>
    <script src="./bundle.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            fetch('./missions.json')
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    var missions = data
                        .filter(function (mission) { return mission.rating_average !== -1; })
                        .map(window.ThiefMissionsViz.convertMissionFromJson);
                    window.ThiefMissionsViz.init({ root: '#viz-root', data: missions });
                })
                .catch(function (error) {
                    console.error('Failed to load missions', error);
                });
        });
    </script>
</body>
</html>
